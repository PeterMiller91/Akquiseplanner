version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ds-akquise-db
    environment:
      POSTGRES_USER: ds_user
      POSTGRES_PASSWORD: ds_password_change_me
      POSTGRES_DB: ds_akquise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ds_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: ds-akquise-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
